name: Research Reproducibility Workflow

on:
  workflow_dispatch:
    inputs:
      verify_all_structures:
        description: "Re-extract features and verify metrics across all 2,916 bilayers"
        required: true
        default: "true"

permissions:
  contents: read

jobs:
  reproduce:
    name: Full Dataset Reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web,ml-extra]"

      - name: Run Test Split Metric Reproduction
        run: |
          python -c "
          import pandas as pd, json, numpy as np
          from pathlib import Path
          from script.core.models import StackingPredictor, compute_metrics

          df = pd.read_csv('results/features_original_model_ready.csv')
          predictor = StackingPredictor()
          X = df[predictor.feature_names]
          probs = predictor.predict_interface_proba(X)
          preds = (probs >= predictor.threshold).astype(int)
          y_true = (df['adjusted_energy'] > 0).astype(int).values

          m = compute_metrics(y_true, preds, probs)
          print(f'Full Dataset MCC    : {m[\"mcc\"]:.6f}')
          print(f'Full Dataset ROC-AUC: {m[\"roc_auc\"]:.6f}')
          assert m['mcc'] > 0.80, 'MCC degraded below scientific baseline'
          print('Reproduction check successful!')
          "
