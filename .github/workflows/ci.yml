name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install NanoStack 3D Core and Test Dependencies
        run: |
          python -m pip install -e ".[dev,web]"

      - name: Verify CLI and Environment
        run: |
          nanostack3d verify

      - name: Run Automated Test Suite
        run: |
          pytest script/tests/ -v --durations=10

      - name: Verify Notebook Cryptographic Baseline Hashes
        if: runner.os == 'Linux'
        run: |
          python -c "
          import hashlib, json, sys
          from pathlib import Path

          baseline_file = Path('audit/notebook_baseline_hashes.json')
          if not baseline_file.exists():
              print('Warning: baseline hash file not found; skipping hash check')
              sys.exit(0)

          with open(baseline_file) as f:
              expected = json.load(f)

          failed = False
          for rel_path, exp_hash in expected.items():
              p = Path(rel_path)
              if not p.exists():
                  print(f'FAIL: Notebook missing {rel_path}')
                  failed = True
                  continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              if h != exp_hash:
                  print(f'FAIL: Hash mismatch for {rel_path}')
                  failed = True
              else:
                  print(f'OK: {rel_path}')

          if failed:
              sys.exit(1)
          print('All notebook hashes verified!')
          "
